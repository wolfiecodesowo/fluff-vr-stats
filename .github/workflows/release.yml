# When a release is published: sign it (so the auto-updater accepts it) and attach the Windows installer.
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   RELEASE_KEY      = the whole text of keys/release_key.pem (made by tools/make_keys.py)   [needed for signing]
#   SIGNPATH_*       = optional, for a code-signed .exe (SignPath gives free signing to open source projects)
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to build (e.g. v0.4.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: sign the release (fluff-manifest.json)
        shell: pwsh
        env:
          RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
        run: |
          # an unsigned release is refused by every install's updater, so this must fail the job loudly
          if (-not $env:RELEASE_KEY) { Write-Host "::error::no RELEASE_KEY secret: $env:TAG is UNSIGNED and updates will refuse it. add the secret, then re-run this workflow"; exit 1 }
          python -m pip install cryptography
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::couldn't install cryptography"; exit 1 }
          $keyfile = Join-Path $env:RUNNER_TEMP "release_key.pem"
          Set-Content -Path $keyfile -Value $env:RELEASE_KEY -NoNewline
          $env:RELEASE_KEY_FILE = $keyfile
          python tools/sign_release.py $env:TAG --upload
          $signed = $LASTEXITCODE
          Remove-Item $keyfile
          if ($signed -ne 0) { Write-Host "::error::signing $env:TAG failed"; exit 1 }

      - name: install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: build the installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer\build_installer.ps1

      # - name: code-sign the .exe (SignPath, free for open source) - fill in once ur project is approved
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with: { api-token: "${{ secrets.SIGNPATH_API_TOKEN }}", organization-id: "...", project-slug: "fluff-vr-stats",
      #           signing-policy-slug: "release-signing", artifact-configuration-slug: "installer",
      #           github-artifact-id: "...", wait-for-completion: true, output-artifact-directory: dist }

      - name: attach installer + checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\FluffVRStats-Setup-*.exe | Select-Object -First 1
          (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $exe.Name | Out-File -Encoding ascii "dist\SHA256SUMS.txt"
          gh release upload $env:TAG $exe.FullName dist\SHA256SUMS.txt --clobber

      - name: check the release is complete (manifest + installer)
        shell: pwsh
        run: |
          $names = @(gh release view $env:TAG --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::couldn't read the release $env:TAG"; exit 1 }
          if ($names -notcontains 'fluff-manifest.json') { Write-Host "::error::$env:TAG has no fluff-manifest.json, so updaters will refuse it"; exit 1 }
          if (-not ($names | Where-Object { $_ -like 'FluffVRStats-Setup-*.exe' })) { Write-Host "::error::$env:TAG has no installer .exe"; exit 1 }
          Write-Host "release $env:TAG is complete and signed"
